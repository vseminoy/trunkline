# ШАБЛОН ПРОФИЛЯ СТЕКА — скопировать каталог под своим именем и заполнить.
#
# Один профиль = один технологический стек. Ядро (`core/`) не знает ни одного языка,
# инструмента и команды: всё это живёт здесь и попадает в шаги через слоты этого файла.
#
# Как копировать:
#   1. `cp -r profiles/example-stack profiles/<владелец>-<стек>`
#   2. Заполнить слоты ниже. Плейсхолдеры вида <…> обязаны исчезнуть все.
#   3. `name:` обязано совпасть с именем каталога — по нему профиль адресуют флаг
#      `profile:` в `AGENTS.md` проекта, `trunkline profile add` и вендоринг.
#   4. `python3 scripts/lint-core-profile-boundary.py` — проверит слоты и пути.
#
# Пример полностью заполненного профиля — в конце этого файла (закомментирован).
# В каждом файле профиля (`guidelines/`, `steps/`, `tasks/`, `hooks/`) есть раздел
# «Как это выглядит заполненным» с примером на том же демо-стеке.
#
# Имя профиля начинается с организации-владельца гайдлайнов, а не со стека: гайдлайны —
# это ЧЬИ-ТО стандарты. Два профиля с одним стеком и разными правилами по типам и
# авторизации — нормальная ситуация, различать их надо по владельцу.
#
# ВАЖНО ПРО ПУТИ. Пути внутри профиля (`guidelines`, `step_overlays`, `hooks`) даны
# **от каталога этого профиля**. Профиль — переносимый пакет: скопировать каталог и
# править содержимое должно быть достаточно. Путь, называющий профиль внутри себя
# (`profiles/<имя>/guidelines/…`), запрещён и отбивается линтером: в копии он продолжает
# указывать на оригинал, и копия молча читает чужие гайдлайны.
# Исключение — `tasks.*`: они указывают за пределы профиля, см. комментарий там.

name: example-stack
version: 0.1.0
language: <язык, напр. Go>
description: >
  <Одно-два предложения: какие сервисы этим стеком пишут, чем задан контракт,
  чем ходят в базу, чем мигрируют. Пример: HTTP-сервисы на Echo с контрактом
  OpenAPI (кодогенерация oapi-codegen), доступом к БД через sqlc и миграциями goose.>

# --- Стек: чем закрыт каждый слот пайплайна ------------------------------------
#
# Слот пустой (null) → шаги, которые на него опираются, не применимы
# и объявляются как «не применимо» с объяснением. Это штатный ответ, а не пробел:
# в стеке без кодогенерации `contract.codegen: null` честнее выдуманного значения.

stack:
  contract:
    kind: <чем задан контракт API, напр. OpenAPI 3; либо null, если контракта нет>
    codegen: <генератор по контракту, напр. oapi-codegen; null — пишем руками>
    artifact: "<файл контракта, напр. *.yaml спецификации>"
    # Что запрещено писать руками, потому что генерируется. Пустой список — тоже
    # ответ: он говорит шагу 8, что руками пишется всё.
    generated: [<напр. request/response структуры, интерфейсы сервера, роутинг>]
  db_access:
    kind: <чем ходим в базу, напр. sqlc / ORM / голый драйвер>
    artifact: "<где живут запросы, напр. queries/*.sql>"
    generated: [<что генерируется, напр. структуры строк, методы запросов>]
  migrations:
    kind: <инструмент миграций, напр. goose; null — миграций нет>
    artifact: "<формат файла миграции>"
  http:
    kind: <HTTP-слой, напр. Echo>
    middleware: <true|false — есть ли слой middleware>

# --- Команды проекта -----------------------------------------------------------
#
# Шаги 8, 16, 17, 19 и хук pre-commit вызывают их по имени слота, а не текстом.
# Поэтому команда, вписанная в шаг ядра, — это ошибка границы, а вписанная сюда —
# норма. Слот, которого в стеке нет, — `null`, а не выдуманная команда: шаг тогда
# объявит проверку неприменимой вместо того, чтобы упасть.

commands:
  build: "<команда сборки; в языках без компиляции — ближайший аналог, напр. проверка синтаксиса>"
  lint: "<команда линтинга; null, если линтера нет>"
  test: "<полный прогон тестов>"
  test_unit: "<быстрые тесты без инфраструктуры>"
  test_integration: "<тесты, которым нужны БД и внешние сервисы>"

# --- Файлы, без которых пайплайн не стартует -----------------------------------
#
# Единственный файл, обязательный независимо от профиля, — `AGENTS.md` (в нём флаги),
# и его требует ядро. Всё остальное — решение профиля: файл конвенций, конфиг линтера,
# манифест зависимостей. Пустой список тоже допустим.

required_project_files:
  - path: AGENTS.md
    why: стандарты кода и блок `## Pipeline flags`
  - path: <напр. .golangci.yml>
    why: <зачем этот файл нужен пайплайну>

# --- Слои системы --------------------------------------------------------------
#
# Используются шагом 3 (импакт), шагом 7 (разбиение тестов по слоям)
# и шагом 4 (декомпозиция). Порядок = снизу вверх по зависимостям: так их читает
# шаг 7, выстраивая описание тестов от базы к точке входа.

layers:
  - id: <напр. db>
    name: <человеческое имя слоя>
    artifacts: [<файлы этого слоя>]
  - id: <напр. service>
    name: <бизнес-логика>
    artifacts: [<файлы>]
    # `test_file` — где шаг 7 ждёт тесты этого слоя. Нет тестов у слоя (схема БД) —
    # ключ не пишем.
    test_file: <напр. service_test.go>

# --- Гайдлайны: роль → файл ----------------------------------------------------
#
# Ядро ссылается на РОЛЬ (`guidelines.roles.data_types`), а не на имя файла: имена
# файлов — ваше дело. Роли, которые ядро спрашивает сегодня: `api_spec`, `migrations`,
# `data_types`, `db_schema_style`, `auth`. Профиль вправе объявить свои сверх этого —
# на них будут ссылаться только его собственные надстройки шагов.
#
# Гайдлайнов может не быть вовсе: тогда блоки сверки объявляются «не применимо».
# Но это ровно тот файл, ради которого профиль и заводят: правила по контрактам,
# миграциям, типам и авторизации — единственное, что отличает вашу команду от чужой.

guidelines:
  root: guidelines/
  index: guidelines/README.md
  roles:
    migrations: 01-migrations.md
    api_spec: 02-api-contract.md
    data_types: 03-data-types.md
    auth: 04-auth.md
    db_schema_style: 05-db-schema-style.md

# --- Надстройки шагов ----------------------------------------------------------
#
# Файл шага в ядре стек-агностичен. Если профилю есть что добавить именно на этом
# шаге — он кладёт надстройку сюда, и исполнитель читает её сразу после файла шага.
#
# Три правила:
#   * Надстройка УТОЧНЯЕТ шаг, а не переписывает: при конфликте с ядром выигрывает ядро.
#   * Пустых надстроек не заводить — лишний файл в контексте дороже, чем его отсутствие.
#   * Шага нет в списке → надстройки нет, это норма.
#
# Номера берутся из имён файлов `core/developer/steps/` (00, 01, 02, 03, 04, 05, 06,
# 07, 07a, 08, 09-10, 11, 12, 15, 16, 17, 18, 19, 20). Несуществующий номер линтер
# отбивает, а файл на диске, не объявленный здесь, считается осиротевшим.

step_overlays:
  "03": steps/03-impact.md
  "07": steps/07-tester.md

# --- Трекер задач: где живут подзадачи и чем они заводятся ---------------------
#
# Используется аналитической веткой (`core/analytic/`). Ядро не знает ни имени
# инструмента, ни формата файлов — только слоты отсюда.
#
# Секция `null` — допустимо: аналитик тогда складывает `.md` в названную пользователем
# папку и на этом останавливается, шаги публикации объявляются «не применимо».
# Объявлена → `trunkline init` кладёт в проект вторую точку входа (`/trunkline-analytic`)
# и создаёт `<dir>`.
#
# ЗДЕСЬ ТРИ ЯКОРЯ ПУТЕЙ, и путать их нельзя:
#   * `format_spec`, `publisher.setup` — документы ПРОФИЛЯ, путь от каталога профиля.
#     Они едут в проект вместе с профилем, поэтому доступны и там.
#   * `dir`, `analysis_dir` — данные РАЗРАБАТЫВАЕМОГО ПРОЕКТА, путь от корня проекта.
#     Это единственные слоты, которым разрешено выйти за его пределы (`../analysis/`),
#     если анализ держат в отдельном репозитории. Абсолютный путь запрещён:
#     он не переезжает между машинами.
#   * `publisher.contract` — документ ИНСТРУМЕНТА, путь от корня пайплайна.
#     Издатель у профилей может быть общий, и копия контракта в каждом профиле
#     разъедется с кодом, который его исполняет.

tasks:
  # Соглашения команды по оформлению задач: что писать внутри полей. Аналитик обязан
  # прочитать это перед оформлением файлов. Не пересказывает контракт издателя —
  # граница проходит по тому, кто ловит нарушение: контракт — код, отказом в заведении;
  # соглашения — ревью.
  format_spec: tasks/task-format.md
  # Чем подтверждены ставки оценки шага 5 и где они не проверены. Слота нет → шаг 5
  # работает на ставках ядра как есть; они дефолт, а не измерение вашей команды.
  estimation_calibration: tasks/estimation-calibration.md
  # Корень задач; подпапка = ключ эпика. Путь — от корня разрабатываемого проекта.
  dir: .pipeline/tasks/
  # Состояние анализа (не задача, сканером издателя не подхватывается).
  analysis_dir: .pipeline/tasks/_analysis/
  publisher:
    name: go-jira-mcp
    setup: tasks/publisher-setup.md
    contract: publishers/go-jira-mcp/task-format.md
    # Имена операций издателя, которые аналитик ПРЕДЛАГАЕТ пользователю.
    # Запускает их всегда пользователь: публикация необратима и вне репозитория.
    operations:
      pull: pull_epic
      dry_run: dry_run
      publish: create_all_tasks
      publish_one: create_jira_task

# --- Прочее --------------------------------------------------------------------

hooks:
  # Кэш документации для шага 8 — какие домены имеет смысл кэшировать.
  doc_cache_targets: [<фреймворк>, <библиотека доступа к БД>, <генератор>]
  # Машинный гейт перед коммитом (установка — core/developer/ENFORCEMENT.md).
  pre_commit_gate: hooks/pre-commit-gate.sh

# --- Как это выглядит заполненным ----------------------------------------------
#
# Ниже — тот же файл, заполненный целиком для демо-стека (Python 3.12 + FastAPI +
# SQLAlchemy 2.0 + Alembic, PostgreSQL 16). Тот же стек разобран в примерах внутри
# `guidelines/`, `steps/`, `tasks/` и `hooks/`. Это справка, а не второй профиль:
# YAML читает только то, что выше, — блок закомментирован целиком.
#
#   name: acme-py-fastapi
#   version: 0.1.0
#   language: Python 3.12
#   description: >
#     HTTP-сервисы на FastAPI: контракт OpenAPI 3.1 собирается из Pydantic-моделей
#     и коммитится в openapi.json, доступ к БД — SQLAlchemy 2.0, миграции — Alembic,
#     СУБД — PostgreSQL 16.
